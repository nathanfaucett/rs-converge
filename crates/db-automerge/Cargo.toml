[package]
name = "db-automerge"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_automerge"

[features]
std = ["db-btree/std", "db-core/std", "async-lock/std", "futures/std", "uuid/std", "serde/std", "base64/std"]
wasm = ["automerge/wasm"]
default = ["std"]

[dependencies]
# internal dependencies
db-btree = { path = "../db-btree", default-features = false, features = [] }
db-core = { path = "../db-core", default-features = false, features = [] }

async-stream = { version = "0.3", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "executor",
] }
uuid = { version = "1.4", default-features = false, features = ["v4", "serde"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
automerge = { version = "0.9", default-features = false, features = [] }
db-engine = { path = "../db-engine", default-features = false, features = [
  "std",
] }
async-lock = { version = "3.4", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
base64 = { version = "0.21", default-features = false, features = ["std"] }

[dev-dependencies]
db-engine = { path = "../db-engine", default-features = false, features = [
  "std",
  "in-memory",
] }
db-redb = { path = "../db-redb", default-features = false, features = [] }
redb = { version = "4.1", default-features = false, features = ["uuid"] }
