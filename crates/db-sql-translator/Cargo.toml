[package]
name = "db-sql-translator"
description = "SQL translator"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_sql_translator"

[features]
default = ["std"]
std = ["db-query/std", "db-schema/std", "db-value/std", "sqlparser/std", "thiserror/std"]
wasm = [
  "tsify",
  "serde",
  "serde-wasm-bindgen",
  "wasm-bindgen",
  "db-query/wasm",
  "db-schema/wasm",
  "db-value/wasm",
]

[dependencies]
db-query = { path = "../db-query", default-features = false, features = [] }
db-schema = { path = "../db-schema", default-features = false, features = [] }
db-value = { path = "../db-value", default-features = false, features = ["serde_json"] }

sqlparser = { version = "0.62", default-features = false, features = [] }
thiserror = { version = "2.0", default-features = false, features = [] }
uuid = { version = "1.18", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Optional TS generation + serde for tsify
tsify = { version = "0.5", default-features = false, features = [
  "js",
], optional = true }
serde = { version = "1.0", default-features = false, features = [
  "derive",
], optional = true }
serde-wasm-bindgen = { version = "0.6", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
