[package]
name = "db-engine"
description = "Engine layer of the database"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_engine"

[features]
default = ["std", "in-memory"]
std = ["futures/std", "db-core/std", "db-in-memory?/std"]
in-memory = ["dep:db-in-memory"]
wasm = ["tsify", "serde-wasm-bindgen", "wasm-bindgen"]

[dependencies]
db-core = { path = "../db-core", default-features = false }
db-in-memory = { path = "../db-in-memory", default-features = false, optional = true }
async-stream = { version = "0.3", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = [] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
] }
spin = { version = "0.11", default-features = false, features = ["rwlock"] }
thiserror = { version = "2.0", default-features = false }

# Optional TS generation + serde for tsify
tsify = { version = "0.5", default-features = false, features = [
  "js",
], optional = true }
serde-wasm-bindgen = { version = "0.6", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
proptest = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.23", default-features = false, features = ["std"] }
