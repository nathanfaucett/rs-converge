[package]
name = "db-redb"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_redb"

[features]
default = []

[dependencies]
# Engine traits
db-engine = { path = "../db-engine", default-features = false, features = [
  "std",
] }

# Concurrency / streams
async-stream = { version = "0.3", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "executor",
] }
async-lock = { version = "3.4", default-features = false, features = ["std"] }

# Storage backend
redb = { version = "4.1", default-features = false, features = ["uuid"] }

# Concurrent map used by manager
dashmap = { version = "6.2", default-features = false, features = [] }

# Serialization (user requested postcard)
serde = { version = "1.0", default-features = false, features = ["std"] }
postcard = { version = "1.1", default-features = false, features = [
  "heapless-cas",
  "use-std",
] }

[dev-dependencies]
