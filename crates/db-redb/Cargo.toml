[package]
name = "db-redb"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_redb"

[dependencies]
# Engine traits
db-engine = { path = "../db-engine", default-features = true }

# Concurrency / streams
async-stream = { version = "0.3", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-lock = { version = "3.4", default-features = false, features = [] }

# Storage backend
redb = { version = "4.0", default-features = false, features = [] }

# Concurrent map used by manager
dashmap = { version = "6.2", default-features = false, features = [] }

# Serialization (user requested postcard)
serde = { version = "1.0", default-features = false, features = ["std"] }
postcard = { version = "1.1", default-features = false, features = ["heapless-cas", "use-std"] }

[dev-dependencies]

[features]
default = []
