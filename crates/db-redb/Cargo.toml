[package]
name = "db-redb"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_redb"

[features]
default = []

[dependencies]
# internal dependencies
db-btree = { path = "../db-btree", default-features = false, features = ["std"] }
db-core = { path = "../db-core", default-features = false, features = ["std"] }

async-stream = { version = "0.3", default-features = false, features = [] }
automerge = { version = "0.9", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "executor",
] }
async-lock = { version = "3.4", default-features = false, features = ["std"] }
redb = { version = "4.1", default-features = false, features = ["uuid"] }
dashmap = { version = "6.2", default-features = false, features = [] }
serde = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.4", default-features = false, features = ["v7", "serde", "std"] }

[dev-dependencies]
