[package]
name = "db-redb"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "db_redb"

[features]
wasm = ["automerge/wasm"]
default = []

[dependencies]
# internal dependencies
db-btree = { path = "../db-btree", default-features = false }
db-automerge = { path = "../db-automerge", default-features = false }

async-stream = { version = "0.3", default-features = false, features = [] }
automerge = { version = "0.9", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "executor",
] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
async-lock = { version = "3.4", default-features = false, features = ["std"] }
redb = { version = "4.1", default-features = false, features = ["uuid"] }
dashmap = { version = "6.2", default-features = false, features = [] }
serde = { version = "1.0", default-features = false, features = ["std"] }
postcard = { version = "1.1", default-features = false, features = ["heapless-cas", "use-std"] }
uuid = { version = "1.4", default-features = false, features = ["v7", "serde", "std"] }

[dev-dependencies]
