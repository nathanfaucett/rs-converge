name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with rustfmt + clippy)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Install just
        run: cargo install just --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Root integration boundary
        run: "! grep -RE 'use (engine|sync|value|engine_redb|engine_automerge|redb|uuid|tokio|futures|macros)' tests"

      - name: Rust fmt check
        run: just fmt-check

      - name: Cargo clippy
        run: just clippy

  cargo-tests:
    name: Cargo tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install just
        run: cargo install just --locked

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install crap
        run: cargo install cargo-crap --version 0.5.0 --locked

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Show rustc/cargo
        run: rustc --version && cargo --version

      - name: Test SQL behavior
        run: just test-sql

      - name: Test feature combinations
        run: cargo hack test --feature-powerset --all-targets

  durable-automerge-redb:
    name: Durable Automerge/Redb integration
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Test durable Automerge/Redb integration
        run: cargo test --features redb,automerge --test automerge_sync
